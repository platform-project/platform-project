    <script type="text/javascript">
        $.noConflict();

        // registering global variables
        http = "http://";
        https = "https://";
        file = "file://";

        function urlprotocol(url) {
            server = http + 'platform';
            address = $.trim(url);

            if (address == '') {
                address = server + "/?platform";
            }

            query_string = address.split("://");
            protocol = query_string[0];
            command = query_string[1];
            command = $.trim(command);
            switch (protocol) {
                case '~':
                case 'e':
                case 'en':
                case 'platform':
                    if (command.length === 0) {
                        address = server + "/?platform";
                    } else {
                        switch (command) {
                            case 'platform':
                                address = server + "/?platform";
                                break;
                            case 'applications':
                            case 'framework':
                            case 'help':
                            case 'info':
                            case 'libraries':
                            case 'mirrors':
                            case 'networks':
                            case 'respository':
                            case 'sandbox':
                            case 'servers':
                            case 'sites':
                            case 'system':
                            case 'workspace':
                                address = server + "/?" + command;
                                break;
                        }
                    }
                    break;
                case 'apps':
                    address = (command.length === 0) ?
                        server + "/?applications" :
                        server + "/sandbox/system/applications/" + command;
                    break;
                case 'applications':
                case 'framework':
                case 'help':
                case 'info':
                case 'libraries':
                case 'mirrors':
                case 'networks':
                case 'respository':
                case 'sandbox':
                case 'servers':
                case 'sites':
                case 'system':
                case 'workspace':
                    address = server + "/?" + protocol;
                    break;

                case 'tests':
                    address = server + "/sandbox/workspace/tests/" + command;
                    break;

                case 'studio':
                    address = server + "/sandbox/workspace/tests/studio/" + command;
                    break;

                case 'sh':
                case 'shell':
                case 'console':
                    address = server + "/sandbox/system/applications/console?command=" + command;
                    break;

                case 'radio':
                case 'fm':
                    address = http + command + '.fm/';
                    break;

                case 'pictures':
                case 'photo':
                    address = server + "/sandbox/system/applications/photo/";
                    break;
                case 'weather':
                    address = server + "/sandbox/system/applications/weather/";
                    break;
                case 'play':
                case 'games':
                    address = server + "/sandbox/system/applications/games/";
                    break;
                case 'launcher':
                    address = server + "/sandbox/system/applications/launcher/";
                    break;
                case 'satellite':
                    address = server + "/sandbox/system/applications/satellite/";
                    break;
                case 'video':
                case 'tube':
                case 'screen':
                    address = server + "/sandbox/system/applications/video/";
                    break;

                case 'stream':
                    address = server + "/sandbox/workspace/tests/video/streaming?" + command;
                    break;

                case protocol:
                    address = protocols(protocol, command);
                    break;

                default:
                    address = server + "/?platform";
                    break;
            }
            //track();
            network_status();
            pageloader(address);
            console.log(address);
        }

        function show_info() {
            $('#info .info.wrapper').animate({
                width: ["toggle", "linear"],
                height: ["toggle", "linear"],
                opacity: "toggle"
            }, "fast", "linear", function() {
                console.log("Animation complete.");
            });
        }

        function network_status() {
            (function poll() {
                setTimeout(function() {
                    $.ajax({
                        url: '/sandbox/workspace/tests/system/load.php',
                        type: 'POST',
                        data: 'request=network',
                        success: function(data) {
                            $(".benchmark #network").html(data);
                        },
                        complete: poll
                    });
                }, 20000);
            })();
        }

        function pageloader(address) {
            $('iframe').attr('src', address);
            system_load('network');
            system_load('location');
            system_load('device');
            system_load('memory');
            system_load('pageload');
            system_load('installer');
            system_load('updater');
        }

        function track() {
            user_input = $('input[name=address-bar]').val();
            $.ajax({
                url: '/sandbox/workspace/tests/system/track.php',
                type: 'POST',
                data: 'input=' + user_input,
                async: true,
                success: function(data) {},
                error: function(data) {
                    console.log('Error occured when requesting system/track.php');
                }
            });
        }

        function protocols(protocol, command) {
            switch (protocol) {
                // generic protocols
                case 'http':
                case 'https':
                    // do nothing
                    break;

                case 'find':
                case 'search':
                    address = http + 'www.bing.com?q=' + command;
                    break;

                case 'bower':
                    address = http + 'bower.io/search/?q=' + command;
                    break;

                case 'wiki':
                    address = http + 'en.wikipedia.org/wiki/' + command;
                    break;

                    // other protocols

            }
            return address;
        }


        function system_load(stack) {
            switch (stack) {
                case 'network':

                    $.ajax({
                        url: '/sandbox/workspace/tests/system/load.php',

                case 'location':

                case 'device':

                case 'memory':

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('addTrack').addEventListener('change', function(event) {
                const file = event.target.files[0];
                const audioElement = document.getElementById('audio');
                const artworkElement = document.getElementById('album-artwork');
                const trackNameElement = document.getElementById('track-name');
                const artistNameElement = document.getElementById('artist-name');
                const progressBar = document.getElementById('progress-bar');
                const timerElement = document.getElementById('timer');

                if (file) {
                    // Load the audio file into the audio element
                    const objectURL = URL.createObjectURL(file);
                    audioElement.src = objectURL;

                    // Read tags from the file
                    jsmediatags.read(file, {
                        onSuccess: function(tag) {
                            const tags = tag.tags;

                            // Display album artwork
                            const picture = tags.picture;
                            if (picture) {
                                let base64String = "";
                                for (let i = 0; i < picture.data.length; i++) {
                                    base64String += String.fromCharCode(picture.data[i]);
                                }
                                const base64 = "data:" + picture.format + ";base64," + btoa(base64String);
                                artworkElement.src = base64;
                                artworkElement.style.display = 'block';
                            } else {
                                artworkElement.src = 'sites/icons/no-album.png';
                                artworkElement.style.display = 'block';
                            }

                            // Display track name
                            if (tags.title) {
                                trackNameElement.textContent = "Track: " + tags.title;
                            } else {
                                trackNameElement.textContent = "Track: Unknown";
                            }

                            // Display artist name
                            if (tags.artist) {
                                artistNameElement.textContent = "Artist: " + tags.artist;
                            } else {
                                artistNameElement.textContent = "Artist: Unknown";
                            }
                        },
                        onError: function(error) {
                            console.log(error);
                            artworkElement.style.backgroundImage = 'sites/icons/no-album.png';
                            trackNameElement.textContent = "Track: Unknown";
                            artistNameElement.textContent = "Artist: Unknown";
                        }
                    });

                    // Reset progress bar and timer
                    progressBar.style.width = '0%';
                    timerElement.textContent = '00:00:00 / 00:00:00';

                    // Update progress bar and timer during playback
                    audioElement.ontimeupdate = function() {
                        const currentTime = audioElement.currentTime;
                        const duration = audioElement.duration;

                        if (!isNaN(duration)) {
                            const progressPercent = (currentTime / duration) * 100;
                            progressBar.style.width = progressPercent + '%';

                            const formatTime = (time) => {
                                const hours = Math.floor(time / 3600);
                                const minutes = Math.floor((time % 3600) / 60);
                                const seconds = Math.floor(time % 60);
                                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                            };

                            timerElement.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                        } else {
                            timerElement.textContent = '00:00:00 / 00:00:00';
                        }
                    };
                } else {
                    console.error("No file selected or file not found.");
                }
            });
        });
    </script>

    <script>
        $(document).ready(function() {
            var lastCommitSha = '';

            function checkForCommits() {
                $.ajax({
                    url: 'https://api.github.com/repos/platform-project/platform-project/commits', // Replace {owner} and {repo} with actual values
                    method: 'GET',
                    dataType: 'json',
                    success: function(commits) {
                        var view = '';
                        if (commits.length > 0) {
                            var latestCommitSha = commits[0].sha;
                            if (latestCommitSha !== lastCommitSha) {
                                if (lastCommitSha !== '') {
                                    view = '<a class="notification-indicator" href="javascript:{}"><div class="updater"><i class="fi-wrench fi-platform size-18"></i> <span class="label">New update available</span></a> ';
                                    $('#updater').html(view);
                                    console.log('New commit detected: ' + commits[0].commit.message);
                                } else {
                                    view = '<a class="notification-indicator" href="javascript:{}"><div class="updater"><i class="fi-wrench fi-platform size-18"></i> <span class="label">System up to date</span></a> ';
                                    $('#updater').html(view);
                                    console.log('No commits detected');
                                }
                                lastCommitSha = latestCommitSha;
                            } else {
                                view = '<a class="notification-indicator" href="javascript:{}"><div class="updater"><i class="fi-wrench fi-platform size-18"></i> <span class="label">System up to date</span></a> ';
                                $('#updater').html(view);
                                console.log('No commits detected');
                            }
                        } else {
                            view = '<a class="notification-indicator" href="javascript:{}"><div class="updater"><i class="fi-wrench fi-platform size-18"></i> <span class="label">System up to date</span></a> ';
                            $('#updater').html(view);
                            console.log('No commits detected');
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('Error fetching commits:', error);
                    }
                });
            }

            // Polling interval (in milliseconds)
            var pollingInterval = 60000; // Check every 60 seconds

            // Start polling
            setInterval(checkForCommits, pollingInterval);

            // Initial check
            checkForCommits();
        });
    </script>
